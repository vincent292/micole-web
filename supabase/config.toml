project_id = "micole-app"
[functions.r2-media]
verify_jwt = false # La función verifica el JWT con auth.getUser; admite signing keys asimétricas.

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5175/auth/callback", "http://localhost:5173/invite/**", "http://localhost:5175/invite/**"]

[auth.email]
enable_confirmations = true

[functions.push-dispatch]
verify_jwt = false # Internal worker authenticates x-micole-worker-key; no user or public send endpoint.

[functions.bank-qr]
verify_jwt = false # User JWT verified with auth.getUser; public links are exact-charge capabilities; worker uses its private key.

[functions.demo-request]
verify_jwt = false # Formulario público; valida origen, consentimiento y límites en el servidor.
